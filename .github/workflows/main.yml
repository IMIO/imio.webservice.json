name: Tests and Docker image
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # Same PyPI releases of the imio packages as the Docker image, no devel/ needed
      - run: uv sync --frozen --no-default-groups --group prod --group test
      - run: uv run --no-sync pytest

  build-push:
    needs: test
    if: github.ref_type == 'tag'
    runs-on:
      group: self-hosted
    steps:
      # A Docker tag can't contain "/": prod/0.9.0 -> 0.9.0
      - run: echo "IMAGE_TAG=${GITHUB_REF_NAME##*/}" >> "$GITHUB_ENV"
      - name: Build push and notify
        uses: IMIO/gha/build-push-notify@v8
        with:
          IMAGE_NAME: docs/webservicejson
          IMAGE_TAGS: ${{ secrets.HARBOR_URL }}/docs/webservicejson:${{ env.IMAGE_TAG }}
          REGISTRY_URL: ${{ secrets.HARBOR_URL }}
          REGISTRY_USERNAME: ${{ secrets.DOCS_HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCS_HARBOR_PASSWORD }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.DOCS_MATTERMOST_WEBHOOK_URL }}
